# CPU smoke run on synthetic data (~1 minute). Verifies the whole pipeline end to end.
seed: 0
model:
  tokenizer: byte
  backbone: toy
  hidden_size: 64
  num_layers: 2
  num_heads: 4
  max_length: 64
loss: {log: 1.0, spherical: 0.5, rps: 1.0}
optim: {lr: 0.003, weight_decay: 0.01, warmup_steps: 20, min_lr_ratio: 0.1}
data:
  synthetic_train: 2048
  synthetic_val: 256
  batch_size: 64
trainer:
  max_epochs: 8
  accelerator: cpu
  devices: 1
  log_every_n_steps: 10
  default_root_dir: outputs/smoke
  enable_progress_bar: true
